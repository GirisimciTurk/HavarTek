# DroneTek — nginx ters vekil yapılandırması
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dronetek.conf
#   sudo ln -s /etc/nginx/sites-available/dronetek.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Uygulama 127.0.0.1:3000'de çalışır (Docker konteyneri ya da systemd birimi).
# TLS burada biter; Next.js düz HTTP konuşur.

# --- Sıkıştırma -------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types
  text/plain text/css text/xml
  application/javascript application/json application/xml
  application/rss+xml application/manifest+json
  image/svg+xml font/woff2;

# WebSocket yükseltmesi olmayan isteklerde bağlantı kapatılır; yalnızca gerçek
# "Upgrade" isteklerinde yükseltme başlığı iletilir.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- 80: Let's Encrypt doğrulaması + HTTPS'e yönlendirme --------------------
server {
    listen      80;
    listen      [::]:80;
    server_name dronetek.com.tr www.dronetek.com.tr;

    # Sertifika yenilemesi düz HTTP üzerinden doğrulanır; yönlendirmeden muaf.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://dronetek.com.tr$request_uri;
    }
}

# --- 443 (www): apex adrese yönlendirme ------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.dronetek.com.tr;

    # Sertifikayı certbot üretir (apex + www tek sertifikada):
    #   sudo certbot certonly --webroot -w /var/www/certbot \
    #        -d dronetek.com.tr -d www.dronetek.com.tr
    # Sertifika henüz yokken bu iki 443 bloğunu geçici olarak yorum satırı yapın.
    ssl_certificate     /etc/letsencrypt/live/dronetek.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dronetek.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dronetek.com.tr$request_uri;
}

# --- 443 (apex): asıl site --------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name dronetek.com.tr;

    ssl_certificate     /etc/letsencrypt/live/dronetek.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dronetek.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Fotoğraf ağırlıklı site; form gönderimleri küçük ama pay bırakıyoruz.
    client_max_body_size 8m;
    access_log /var/log/nginx/dronetek.access.log;
    error_log  /var/log/nginx/dronetek.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Derleme kimliğiyle adlanan dosyalar — içerikleri asla değişmez.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # next/image çıktısı: adres (genişlik + kalite) değişmedikçe aynı görsel.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_redirect     off;
        proxy_buffering    on;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
