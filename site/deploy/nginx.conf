# HavarTek — nginx ters vekil yapılandırması
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/havartek.conf
#   sudo ln -s /etc/nginx/sites-available/havartek.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Uygulama 127.0.0.1:3000'de çalışır (Docker konteyneri ya da systemd birimi).
# TLS burada biter; Next.js düz HTTP konuşur.

# --- Sıkıştırma -------------------------------------------------------------
# `gzip on;` burada YOK: Debian/Ubuntu paketlerinin /etc/nginx/nginx.conf dosyası
# onu zaten açıyor ve tekrarı "duplicate directive" hatasıyla nginx'i başlatmıyor.
# Sıkıştırmanın kapalı olduğu bir kurulumda bu satırı elle ekleyin.
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types
  text/plain text/css text/xml
  application/javascript application/json application/xml
  application/rss+xml application/manifest+json
  image/svg+xml font/woff2;

# WebSocket yükseltmesi olmayan isteklerde bağlantı kapatılır; yalnızca gerçek
# "Upgrade" isteklerinde yükseltme başlığı iletilir.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- 80: Let's Encrypt doğrulaması + HTTPS'e yönlendirme --------------------
server {
    listen      80;
    listen      [::]:80;
    server_name havartek.com www.havartek.com;

    # Sertifika yenilemesi düz HTTP üzerinden doğrulanır; yönlendirmeden muaf.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://havartek.com$request_uri;
    }
}

# --- 443 (www): apex adrese yönlendirme ------------------------------------
server {
    # HTTP/2 listen satırında açılıyor: ayrı `http2 on;` yönergesi nginx 1.25.1
    # ile geldi, Ubuntu 24.04'ün nginx 1.24'ü onu tanımıyor ("unknown directive").
    # Bu biçim eski ve yeni sürümlerin ikisinde de çalışır.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.havartek.com;

    # Sertifikayı certbot üretir (apex + www tek sertifikada):
    #   sudo certbot certonly --webroot -w /var/www/certbot \
    #        -d havartek.com -d www.havartek.com
    # Sertifika henüz yokken bu iki 443 bloğunu geçici olarak yorum satırı yapın.
    ssl_certificate     /etc/letsencrypt/live/havartek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/havartek.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://havartek.com$request_uri;
}

# --- 443 (apex): asıl site --------------------------------------------------
server {
    # HTTP/2 listen satırında açılıyor: ayrı `http2 on;` yönergesi nginx 1.25.1
    # ile geldi, Ubuntu 24.04'ün nginx 1.24'ü onu tanımıyor ("unknown directive").
    # Bu biçim eski ve yeni sürümlerin ikisinde de çalışır.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name havartek.com;

    ssl_certificate     /etc/letsencrypt/live/havartek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/havartek.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Fotoğraf ağırlıklı site; form gönderimleri küçük ama pay bırakıyoruz.
    client_max_body_size 8m;
    access_log /var/log/nginx/havartek.access.log;
    error_log  /var/log/nginx/havartek.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Derleme kimliğiyle adlanan dosyalar — içerikleri asla değişmez.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # next/image çıktısı: adres (genişlik + kalite) değişmedikçe aynı görsel.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_redirect     off;
        proxy_buffering    on;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
